config: config/game.yaml
physics: config/physics.yaml
map: J_01
map_pool: [J_01, J_02, J_03, J_04, J_05]
map_switch_start_episode: 1200
map_switch_every: 15
track_center: free
track_direction: clockwise
spawn_face_forward: true
num_actors: 32
fps: 60
sync_every: 800
queue_size: 32000
save_every: 250
session_id: Mapa_J_1
save_dir: runs
load_from: null
no_resume: false
max_episodes: 0
episode_time_limit_s: 90
device: cuda
stack_frames: 4
gamma: 0.99
tau: 0.005
policy_lr: 0.0003
q_lr: 0.0003
alpha_lr: 0.0001
# --- ZMIANA vs sac_20: Force exploration on tight J-map corridors ---
# Mapa_5_4 (sac_20): alpha collapsed to 0.05 at ep 4135, policy locked "go straight", peak 8.7m in 55K eps.
# Root cause: agent never explored steering because alpha floor too low + target_entropy too greedy.
init_alpha: 0.3
target_entropy: -0.5  # Was -1.5. Aggressive exploration — J-maps need wide action distributions to discover turning.
alpha_min: 0.15  # Was 0.05. High floor forces sustained exploration. Agent MUST keep trying different steering angles.
alpha_max: 0.5  # Was 0.3. Allow more entropy early on — agent needs freedom to explore on tight corridors.
batch_size: 256
memory_size: 1000000
start_steps: 0
learn_after: 5000
update_every: 1
updates_per_step: 1
hidden_sizes: [512, 512, 256]
grad_clip: 0.5
utd_ratio: 2.0
stratified_sampling: false
render_actor: 0
render_every: 0
# --- ZMIANA vs sac_20: Reward rebalance for corridor navigation ---
# Mapa_5_4: forward_speed_weight=0.6 dominated → "go fast straight" was the only local optimum.
# Fix: reduce speed reward, increase wall avoidance penalties.
reward_scale: 0.8
reward_clip: 20
reward_collision_penalty: -20
reward_alignment_bonus: 0.02
reward_forward_speed_weight: 0.3  # Was 0.6. Halved — speed reward must NOT dominate over wall avoidance.
reward_front_speed_weight: 0.3  # Was 0.2. Increased — reward for having clearance ahead while moving.
reward_front_penalty: 0.12  # Was 0.06. Doubled — stronger punishment for approaching front walls.
reward_side_penalty: 0.06  # Was 0.02. Tripled — tight corridors need strong side-wall awareness.
reward_min_clear_penalty: 0.08  # Was 0.04. Doubled — penalty for getting too close to any wall.
reward_balance_penalty: 0.03  # Was 0.015. Doubled — centering in corridor matters more on tight tracks.
reward_reverse_penalty: 0.03
reward_front_cone_deg: 20
# --- DR unchanged ---
dr_enable: true
dr_physics: true
dr_accel_scale_range: [0.7, 1.3]
dr_brake_scale_range: [0.7, 1.3]
dr_reverse_scale_range: [0.7, 1.3]
dr_max_speed_scale_range: [0.85, 1.15]
