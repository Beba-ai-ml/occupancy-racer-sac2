## config_sac_31.yaml — Post-plateau fix (consensus from 3-agent analysis + critic review)
## Key changes vs sac_30:
##   - Switch to train_ssac.py (fixes action mismatch bug + state_dim bug)
##   - action_repeat 8→3 (finer control for tight corridors)
##   - DR curriculum: off until ep 3000, phase-in 3000-8000
##   - Single map until ep 3000, rotation from ep 5000
##   - Alpha: lower floor (0.03), tighter target entropy (-1.5)
##   - Reward: softer collision (-8), speed-gated survival bonus
##   - Lidar: 1.5°/5.0° resolution (~156 rays, state_dim=644)
##   - Fresh start mandatory (no checkpoint loading)

config: config/game.yaml
physics: config/physics.yaml
map: J_01
map_pool: [J_01, J_02, J_03, J_04, J_05]
map_switch_start_episode: 5000
map_switch_every: 50
track_center: free
track_direction: clockwise
spawn_face_forward: true
num_actors: 32
fps: 60
sync_every: 800
queue_size: 32000
save_every: 250
session_id: Mapa_6_1
save_dir: runs
load_from: null
no_resume: false
max_episodes: 0
episode_time_limit_s: 90
device: cuda
stack_frames: 4
gamma: 0.99
tau: 0.005
policy_lr: 0.0003
q_lr: 0.0003
alpha_lr: 0.0001
init_alpha: 0.3
target_entropy: -1.5
alpha_min: 0.03
alpha_max: 0.4
batch_size: 256
memory_size: 500000
start_steps: 0
learn_after: 5000
update_every: 1
updates_per_step: 1
hidden_sizes: [512, 512, 256]
grad_clip: 1.0
utd_ratio: 2.0
stratified_sampling: false
render_actor: 0
render_every: 0
# --- Reward (rebalanced) ---
reward_scale: 1.0
reward_clip: 20
reward_collision_penalty: -8
reward_alignment_bonus: 0.02
reward_forward_speed_weight: 0.45
reward_front_speed_weight: 0.3
reward_front_penalty: 0.12
reward_side_penalty: 0.06
reward_min_clear_penalty: 0.08
reward_balance_penalty: 0.03
reward_reverse_penalty: 0.03
reward_front_cone_deg: 20
# --- DR (curriculum-gated in code, these are the FULL target values) ---
dr_enable: true
dr_physics: true
dr_accel_scale_range: [0.7, 1.3]
dr_brake_scale_range: [0.7, 1.3]
dr_reverse_scale_range: [0.7, 1.3]
dr_max_speed_scale_range: [0.85, 1.15]
dr_max_reverse_speed_scale_range: [0.7, 1.3]
dr_friction_scale_range: [0.7, 1.3]
dr_drag_scale_range: [0.6, 1.4]
dr_wheelbase_scale_range: [0.85, 1.15]
dr_max_steer_scale_range: [0.7, 1.0]
dr_surface: true
dr_surface_friction_scale_range: [0.6, 1.4]
dr_surface_drag_range: [0.0, 0.08]
dr_obs_noise: true
dr_lidar_noise_std: 0.03
dr_lidar_drop_prob: 0.02
dr_lidar_spike_prob: 0.02
dr_lidar_scan_drop_prob: 0.10
dr_speed_noise_std: 0.03
dr_servo_noise_std: 0.03
dr_control: true
dr_delay_steps: [0, 1]
dr_steer_rate_limit: 0.1
dr_accel_rate_limit: 0.3
dr_dt_jitter: true
dr_dt_scale_range: [0.85, 1.15]
dr_action_noise: true
dr_action_steer_scale_range: [0.85, 1.15]
dr_action_steer_bias_range: [-0.08, 0.08]
dr_action_accel_scale_range: [0.85, 1.15]
dr_action_accel_bias_range: [-0.3, 0.3]
dr_perturb: true
dr_perturb_prob: 0.04
dr_perturb_yaw_rate_sigma_deg: 1.5
dr_perturb_speed_sigma: 0.15
dr_obs_delay: false
dr_obs_delay_p1: 0.15
dr_obs_delay_p2: 0.03
lidar_front_step_deg: 1.5
lidar_rear_step_deg: 5.0
action_repeat: 3
obst_enable: true
obst_episode_prob: 0.3
obst_start_episode: 10000
obst_max_static: 1
obst_max_total: 3
obst_static_size_range: [0.5, 1.0]
obst_static_persist_prob: 0.4
obst_static_min_distance: 4.0
obst_static_spawn_attempts: 50
obst_min_gap: 1.5
obst_min_wall_clearance: 0.2
obst_allow_wall_overlap: true
obst_min_separation: 1.0
obst_pass_buffer: 0.5
obst_pass_activate_distance: 8.0
obst_dynamic: true
obst_dynamic_spawn_rate: 0.0
obst_dynamic_distance_range: [6.0, 10.0]
obst_dynamic_size_range: [0.4, 0.8]
obst_dynamic_lateral_range: [-2.0, 2.0]
obst_dynamic_ttl_range: [0.0, 0.0]
obst_dynamic_max: 2
obst_dynamic_spawn_attempts: 20
# --- DR Curriculum (new fields, read by racer_env) ---
dr_curriculum_enable: true
dr_curriculum_off_until: 3000
dr_curriculum_full_at: 8000
